<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122119">
<title>Anfitriones · Naturaleza Abierta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-950:#122119; --verde-800:#234131; --verde-700:#2d503e; --verde-600:#3e6d54; --verde-100:#e4eee7; --verde-50:#f0f6f2;
    --arena-50:#f7f9f7; --arena-100:#f0f2ef;
    --ocre-600:#9c6f2f; --ocre-100:#fbf3e5;
    --rojo-600:#c23e3e; --rojo-50:#fdf2f2;
    --tinta-fuerte:#111814; --tinta:#232d27; --tinta-suave:#66736a;
    --borde:#e2e8e3; --borde-suave:#edf1ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--arena-50); color:var(--tinta);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important;}
  button{
    font-family:inherit; font-weight:600; font-size:15px; cursor:pointer;
    border:1px solid transparent; background:var(--verde-700); color:#fff;
    padding:12px 18px; border-radius:10px; min-height:46px;
  }
  button:hover{background:var(--verde-800);}
  button:disabled{opacity:.55;cursor:not-allowed;}
  button.sec{background:#fff;color:var(--tinta);border-color:var(--borde);}
  button.sec:hover{background:var(--arena-50);}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgba(62,109,84,.45);outline-offset:2px;}
  input{
    font-family:inherit; font-size:16px; width:100%; padding:12px 14px;
    border:1px solid var(--borde); border-radius:10px; background:#fff; color:var(--tinta-fuerte);
  }
  label{display:block;font-size:13px;font-weight:600;color:var(--tinta-suave);margin-bottom:6px;}
  a{color:var(--verde-600);}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 15%,#eaf2ec 0%,var(--arena-50) 65%);}
  .login-caja{width:100%;max-width:380px;}
  .login-marca{text-align:center;margin-bottom:24px;}
  .login-marca img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;
    box-shadow:0 4px 12px rgba(18,33,25,.06);margin-bottom:12px;}
  .login-marca h1{margin:0 0 4px;font-size:22px;color:var(--verde-950);letter-spacing:-.02em;}
  .login-marca p{margin:0;color:var(--tinta-suave);}
  .tarjeta-login{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:24px;}
  .campo{margin-bottom:14px;}
  .error{background:var(--rojo-50);color:var(--rojo-600);border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0 0;}

  /* App */
  header.barra{
    position:sticky;top:0;z-index:5;background:var(--verde-950);color:#fff;
    display:flex;align-items:center;gap:12px;padding:10px 16px;
  }
  header.barra img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;}
  header.barra .tit{flex:1;min-width:0;}
  header.barra .tit strong{display:block;font-size:14px;}
  header.barra .tit span{display:block;font-size:12px;color:#a4b8ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.barra button{background:rgba(255,255,255,.1);min-height:38px;padding:8px 14px;font-size:13px;}
  main{max-width:720px;margin:0 auto;padding:18px 16px 60px;}
  h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em;color:var(--tinta-fuerte);}
  .sub{margin:0 0 16px;color:var(--tinta-suave);}
  .vacio{padding:40px 16px;text-align:center;color:var(--tinta-suave);}

  .evento{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:12px;}
  .evento h3{margin:0 0 4px;font-size:17px;color:var(--verde-950);}
  .evento .meta{color:var(--tinta-suave);font-size:13.5px;margin-bottom:12px;}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;}
  .acciones a{text-decoration:none;}

  .resumen{background:var(--verde-950);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .resumen .num{font-size:30px;font-weight:700;letter-spacing:-.02em;}
  .resumen .de{color:#a4b8ab;font-size:14px;}
  .barra-prog{height:8px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:10px;overflow:hidden;}
  .barra-prog div{height:100%;background:#8fd0a9;border-radius:99px;transition:width .25s ease;}

  .herramientas{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .herramientas input{flex:1;min-width:180px;}

  .asistente{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--borde);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .asistente.llego{background:var(--verde-50);border-color:#cfe3d6;}
  .asistente .datos{flex:1;min-width:0;}
  .asistente .nombre{font-weight:700;color:var(--tinta-fuerte);overflow-wrap:anywhere;}
  .asistente .det{font-size:13px;color:var(--tinta-suave);}
  .chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ocre-100);color:var(--ocre-600);margin-top:4px;}
  .asistente button{min-width:96px;}
  .asistente.llego button{background:#fff;color:var(--verde-700);border-color:#cfe3d6;}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta-fuerte);color:#fff;
    padding:10px 16px;border-radius:99px;font-size:13px;z-index:20;}

  /* Resultado de escaneo */
  .resultado{border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;border:2px solid;}
  .resultado.ok{background:var(--verde-50);border-color:#8fd0a9;}
  .resultado.warn{background:var(--ocre-100);border-color:#e4c88f;}
  .resultado.bad{background:var(--rojo-50);border-color:#eba5a5;}
  .resultado .grande{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;}
  .resultado.ok .grande{color:var(--verde-700);} .resultado.warn .grande{color:var(--ocre-600);} .resultado.bad .grande{color:var(--rojo-600);}
  .resultado .quien{font-size:19px;font-weight:700;color:var(--tinta-fuerte);overflow-wrap:anywhere;}
  .resultado .linea{color:var(--tinta);margin-top:4px;}
  .regalo{margin:12px 0;text-align:center;}
  .regalo .hecho{display:inline-block;padding:10px 16px;border-radius:99px;background:var(--verde-100);color:var(--verde-700);font-weight:600;}

  /* Cobro en la puerta */
  .tit-sec{margin:18px 0 8px;font-size:15px;color:var(--tinta-fuerte);}
  .metodos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  button.metodo{background:#fff;color:var(--tinta);border:1px solid var(--borde);padding:10px 14px;min-height:42px;}
  button.metodo.activo{background:var(--verde-700);color:#fff;border-color:var(--verde-700);}
  .caja-metodo{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;}
  .caja-metodo .campo{margin-bottom:12px;}
  .dato{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1ee;}
  .dato span{color:var(--tinta-suave);font-size:13px;}
  .dato strong{display:block;color:var(--tinta-fuerte);overflow-wrap:anywhere;}
  .dato button{min-height:36px;padding:6px 12px;font-size:13px;}
  .qrimg{display:block;margin:12px auto 4px;max-width:240px;width:100%;border-radius:10px;}
  .nota{font-size:13px;color:var(--tinta-suave);margin:10px 0 0;}
  .vuelto{font-size:20px;font-weight:700;color:var(--ocre-600);margin-top:8px;}
  .fila-cobro{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .fila-cobro .arriba{display:flex;justify-content:space-between;gap:10px;font-weight:700;}
  .fila-cobro .abajo{font-size:13px;color:var(--tinta-suave);margin-top:2px;}
  .tabla-tot{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px;background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden;}
  .tabla-tot th,.tabla-tot td{padding:8px 10px;text-align:left;border-bottom:1px solid #edf1ee;}
  .tabla-tot th{font-size:12px;color:var(--tinta-suave);}
  @media (prefers-reduced-motion:reduce){.barra-prog div{transition:none;}}
</style>
</head>
<body>

<!-- ============ ENTRAR ============ -->
<div id="login">
  <div class="login-caja">
    <div class="login-marca">
      <img alt="Naturaleza Abierta" src="https://www.naturalezaabierta.com/wp-content/uploads/2026/03/cropped-cropped-solo-logo-WEB2.png">
      <h1>Anfitriones</h1>
      <p>Naturaleza Abierta</p>
    </div>
    <div class="tarjeta-login">
      <form id="form-login">
        <div class="campo"><label for="email">Correo</label>
          <input id="email" type="email" required autocomplete="username" placeholder="tu@correo.com"></div>
        <div class="campo"><label for="clave">Contraseña</label>
          <input id="clave" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
        <button type="submit" id="btn-entrar" style="width:100%;">Entrar</button>
        <p class="error" id="login-error" hidden></p>
      </form>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="barra">
    <img alt="" src="https://www.naturalezaabierta.com/wp-content/uploads/2026/03/cropped-cropped-solo-logo-WEB2.png">
    <div class="tit"><strong id="quien">Anfitrión</strong><span id="donde">Mis eventos</span></div>
    <button id="btn-salir" type="button">Salir</button>
  </header>
  <main id="contenido"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(
  'https://tgvcvnhrwswuxgjbpvwq.supabase.co',
  'sb_publishable_EKV8OM1y96u-DV_kUPGwkg_BZuGdf4D'
);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtFecha = f => {
  if (!f) return 'Sin fecha';
  const s = String(f);
  const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00') : new Date(s);
  return d.toLocaleDateString('es-VE', { weekday:'long', day:'numeric', month:'long' });
};
const money = (n, m) => Number(n || 0).toFixed(2) + ' ' + (m || 'USD');

let eventoActual = null;   // { evento, asistentes, total_personas }
let filtro = '';
const tokenUrl = new URLSearchParams(location.search).get('t');

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- Entrar / salir ---------- */
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btn-entrar'), err = $('login-error');
  err.hidden = true; btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('clave').value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error){
    err.textContent = error.message === 'Invalid login credentials'
      ? 'Correo o contraseña incorrectos. Revisa los datos e intenta de nuevo.' : error.message;
    err.hidden = false; return;
  }
  iniciar();
});

$('btn-salir').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $('login').hidden = false; $('app').hidden = true; return; }
  $('login').hidden = true; $('app').hidden = false;

  const { data: perfil } = await sb.from('usuarios_panel').select('nombre,email').eq('id', session.user.id).maybeSingle();
  $('quien').textContent = perfil?.nombre || perfil?.email || session.user.email;
  if (tokenUrl){ procesarQR(tokenUrl); } else { mostrarMisEventos(); }
}

/* ---------- Mis eventos ---------- */
async function mostrarMisEventos(){
  eventoActual = null; filtro = '';
  $('donde').textContent = 'Mis eventos';
  const cont = $('contenido');
  cont.innerHTML = '<div class="vacio">Cargando tus eventos…</div>';
  const { data, error } = await sb.rpc('fn_mis_eventos_anfitrion');
  if (error){ cont.innerHTML = '<div class="vacio">No se pudieron cargar tus eventos. Revisa tu conexión y vuelve a abrir la página.</div>'; return; }
  const lista = data || [];
  if (!lista.length){
    cont.innerHTML = '<h2>Mis eventos</h2><div class="vacio">Todavía no tienes eventos asignados. Pide a la administración que te asigne uno con este correo.</div>';
    return;
  }
  cont.innerHTML = '<h2>Mis eventos</h2><p class="sub">Toca un evento para ver quién viene y marcar quién llegó.</p>' +
    lista.map(e => `
      <div class="evento">
        <h3>${esc(e.nombre)}</h3>
        <div class="meta">${esc(fmtFecha(e.fecha))}${e.hora ? ' · ' + esc(e.hora) : ''}${e.ciudad_estado ? ' · ' + esc(e.ciudad_estado) : ''}<br>${e.personas_pagadas} persona(s) con reserva pagada</div>
        <div class="acciones">
          <button type="button" data-ver="${esc(e.id)}">Ver asistentes</button>
          ${e.enlace_grupo_whatsapp ? `<a href="${esc(e.enlace_grupo_whatsapp)}" target="_blank" rel="noopener"><button type="button" class="sec">Grupo de WhatsApp</button></a>` : ''}
        </div>
      </div>`).join('');
  cont.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => abrirEvento(b.dataset.ver));
}

/* ---------- Escaneo de entrada (QR) ---------- */
const copiarTxt = (t) => navigator.clipboard.writeText(String(t)).then(() => toast('Copiado'), () => toast('No se pudo copiar'));
const nombreDe = d => ((d.nombre || '') + ' ' + (d.apellido || '')).trim();
const bs = n => Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function procesarQR(token){
  history.replaceState(null, '', location.pathname);
  await escanear(token);
}

async function escanear(token){
  $('donde').textContent = 'Escaneo de entrada';
  $('contenido').innerHTML = '<div class="vacio">Verificando entrada…</div>';
  const { data, error } = await sb.rpc('fn_marcar_asistencia_qr', { p_token: token });
  pintarResultadoQR(data, error);
}

function pintarResultadoQR(d, error){
  const cont = $('contenido');
  const salir = '<div class="acciones" style="justify-content:center;"><button type="button" id="qr-listo">Listo, siguiente</button></div>';
  if (!error && d && !d.error && Number(d.saldo) > 0 && (d.resultado === 'saldo_pendiente' || d.resultado === 'ya_habia_llegado')){
    return pintarCobro(d);
  }
  let html;
  if (error || !d){
    html = `<div class="resultado bad"><p class="grande">Sin conexión</p><div class="linea">No se pudo verificar. Revisa tu internet y vuelve a escanear el código.</div></div>${salir}`;
  } else if (d.error){
    const msg = {
      no_encontrada: ['Código no válido', 'Este código no corresponde a ninguna entrada.'],
      sin_acceso: ['Sin permiso', 'Tu cuenta no puede validar entradas.'],
      otro_evento: ['Otro evento', `Esta entrada es de “${esc(d.evento_nombre || '')}”, un evento que no tienes asignado.`],
      sin_pagar: ['Pago pendiente', `La reserva de ${esc(nombreDe(d))} no tiene el pago confirmado.`]
    }[d.error] || ['No se pudo validar', 'Intenta de nuevo.'];
    html = `<div class="resultado ${d.error === 'sin_pagar' ? 'warn' : 'bad'}"><p class="grande">${msg[0]}</p><div class="linea">${msg[1]}</div></div>${salir}`;
  } else {
    const ya = d.resultado === 'ya_habia_llegado';
    const hora = d.marcada_en ? new Date(d.marcada_en).toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' }) : '';
    html = `
      <div class="resultado ${ya ? 'warn' : 'ok'}">
        <p class="grande">${ya ? 'Ya había ingresado' : 'Puede pasar'}</p>
        <div class="quien">${esc(nombreDe(d))}</div>
        <div class="linea">${d.personas} persona(s) · ${esc(d.evento_nombre || '')}</div>
        ${ya && hora ? `<div class="linea">Esta entrada se escaneó a las ${esc(hora)}.</div>` : ''}
        ${!ya ? '<div class="linea"><strong>Entrégale su brazalete.</strong></div>' : ''}
        ${d.vuelto > 0 ? `<div class="vuelto">Entrega de vuelto: ${esc(money(d.vuelto, d.moneda))}</div>` : ''}
      </div>
      <div class="regalo" id="zona-regalo">${
        d.regalo_entregado
          ? '<span class="hecho">Regalo ya entregado</span>'
          : '<button type="button" class="sec" id="btn-regalo">Marcar regalo / obsequio entregado</button>'
      }</div>
      ${salir}
      <div class="acciones" style="justify-content:center;margin-top:10px;"><button type="button" class="sec" id="qr-lista">Ver lista del evento</button></div>`;
  }
  cont.innerHTML = html;
  $('qr-listo').onclick = mostrarMisEventos;
  if ($('qr-lista')) $('qr-lista').onclick = () => abrirEvento(d.evento_id);
  if ($('btn-regalo')) $('btn-regalo').onclick = async () => {
    const b = $('btn-regalo'); b.disabled = true;
    const { data: r, error: e } = await sb.rpc('fn_marcar_regalo_qr', { p_token: d.token, p_entregado: true });
    if (e || r?.error){ b.disabled = false; toast('No se pudo guardar el regalo.'); return; }
    $('zona-regalo').innerHTML = '<span class="hecho">Regalo entregado</span>';
  };
}

/* ---------- Cobro del saldo en la puerta ---------- */
function pintarCobro(d){
  const cont = $('contenido');
  const metodos = d.metodos || [];
  const ya = d.resultado === 'ya_habia_llegado';
  cont.innerHTML = `
    <div class="resultado warn">
      <p class="grande">Falta pagar ${esc(money(d.saldo, d.moneda))}</p>
      <div class="quien">${esc(nombreDe(d))}</div>
      <div class="linea">${d.personas} persona(s) · ${esc(d.evento_nombre || '')}</div>
      <div class="linea">≈ ${bs(d.saldo_bs)} Bs a la tasa del día</div>
      ${ya ? '<div class="linea">Ya había ingresado con saldo pendiente.</div>' : ''}
    </div>
    <h3 class="tit-sec">¿Cómo va a pagar?</h3>
    <div class="metodos">
      <button type="button" class="metodo" data-m="efectivo">Efectivo</button>
      ${metodos.map((m, i) => `<button type="button" class="metodo" data-m="${i}">${esc(m.tipo)}</button>`).join('')}
    </div>
    <div id="panel-metodo"></div>
    <div class="acciones" style="margin-top:16px;">
      ${ya ? '' : '<button type="button" class="sec" id="btn-pasar">Dejar pasar con saldo pendiente</button>'}
      <button type="button" class="sec" id="qr-listo">Volver</button>
    </div>`;
  $('qr-listo').onclick = mostrarMisEventos;
  if ($('btn-pasar')) $('btn-pasar').onclick = async () => {
    const b = $('btn-pasar'); b.disabled = true;
    const { data: r, error: e } = await sb.rpc('fn_dejar_pasar_qr', { p_token: d.token });
    if (e || r?.error){ b.disabled = false; toast('No se pudo registrar.'); return; }
    toast('Pasó con saldo pendiente');
    escanear(d.token);
  };
  cont.querySelectorAll('.metodo').forEach(b => b.onclick = () => {
    cont.querySelectorAll('.metodo').forEach(x => x.classList.remove('activo'));
    b.classList.add('activo');
    if (b.dataset.m === 'efectivo') panelEfectivo(d); else panelOtro(d, metodos[Number(b.dataset.m)]);
  });
}

async function registrarCobro(d, metodo, monto, recibido, referencia, btn){
  btn.disabled = true;
  const { data: r, error } = await sb.rpc('fn_registrar_cobro_puerta', {
    p_token: d.token, p_metodo: metodo, p_monto_usd: monto, p_monto_recibido: recibido, p_referencia: referencia
  });
  if (error || r?.error){
    btn.disabled = false;
    const msg = {
      monto_invalido: 'El monto no es válido. El saldo pendiente es ' + money(r?.saldo, d.moneda) + '.',
      recibido_insuficiente: 'El dinero recibido es menor que el monto a cobrar.',
      falta_referencia: 'Escribe la referencia del pago (mínimo 4 caracteres).',
      sin_acceso: 'Tu cuenta no puede registrar cobros en este evento.'
    }[r?.error] || 'No se pudo registrar el cobro. Intenta de nuevo.';
    toast(msg); return;
  }
  if (r.pasa){
    pintarResultadoQR({ ...d, ok: true, resultado: 'marcada', saldo: 0, vuelto: r.vuelto }, null);
  } else {
    toast('Cobro registrado. Aún faltan ' + money(r.saldo_restante, d.moneda));
    escanear(d.token);
  }
}

function panelEfectivo(d){
  $('panel-metodo').innerHTML = `
    <div class="caja-metodo">
      <div class="campo"><label for="cb-monto">Monto a cobrar (USD)</label>
        <input id="cb-monto" type="number" inputmode="decimal" step="0.01" min="0" value="${Number(d.saldo).toFixed(2)}"></div>
      <div class="campo"><label for="cb-recibido">Dinero recibido (USD)</label>
        <input id="cb-recibido" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
      <div id="cb-vuelto" class="vuelto"></div>
      <button type="button" id="cb-ok" style="width:100%;margin-top:12px;">Registrar cobro en efectivo</button>
      <p class="nota">El efectivo queda a tu nombre y la administración lo verifica al cuadrar.</p>
    </div>`;
  const calc = () => {
    const m = Number($('cb-monto').value || 0), r = Number($('cb-recibido').value || 0);
    $('cb-vuelto').textContent = r > 0 && r >= m ? 'Vuelto a entregar: ' + money(r - m, d.moneda) : (r > 0 ? 'Falta ' + money(m - r, d.moneda) + ' para completar' : '');
  };
  $('cb-monto').oninput = calc; $('cb-recibido').oninput = calc;
  $('cb-ok').onclick = () => registrarCobro(d, 'Efectivo', Number($('cb-monto').value), Number($('cb-recibido').value), null, $('cb-ok'));
}

function panelOtro(d, m){
  const campos = m.campos || [];
  const paypal = campos.find(c => /^https:\/\/(www\.)?paypal\.me\//i.test(String(c.valor || '')));
  const linkPaypal = paypal ? String(paypal.valor).replace(/\/+$/, '') + '/' + Number(d.saldo).toFixed(2) : null;
  const esBs = /m[oó]vil/i.test(m.tipo);
  $('panel-metodo').innerHTML = `
    <div class="caja-metodo">
      <div class="dato"><div><span>Monto a pagar</span><strong>${esc(money(d.saldo, d.moneda))}${esBs ? ' · ' + bs(d.saldo_bs) + ' Bs' : ''}</strong></div>
        <button type="button" class="sec" data-copiar="${esBs ? Number(d.saldo_bs).toFixed(2) : Number(d.saldo).toFixed(2)}">Copiar</button></div>
      ${campos.map(c => `<div class="dato"><div><span>${esc(c.etiqueta)}</span><strong>${esc(c.valor)}</strong></div><button type="button" class="sec" data-copiar="${esc(c.valor)}">Copiar</button></div>`).join('')}
      ${m.qr_url ? `<img class="qrimg" alt="QR de pago ${esc(m.tipo)}" src="${esc(m.qr_url)}">` : ''}
      ${linkPaypal ? '<div id="qr-paypal" style="display:flex;justify-content:center;margin-top:12px;"></div><p class="nota" style="text-align:center;">QR de PayPal con el monto ya puesto.</p>' : ''}
      ${m.nota ? `<p class="nota">${esc(m.nota)}</p>` : ''}
      <div class="campo" style="margin-top:14px;"><label for="cb-monto2">Monto cobrado (USD)</label>
        <input id="cb-monto2" type="number" inputmode="decimal" step="0.01" min="0" value="${Number(d.saldo).toFixed(2)}"></div>
      <div class="campo"><label for="cb-ref">Referencia del pago (comprobante)</label>
        <input id="cb-ref" type="text" placeholder="Últimos dígitos de la referencia"></div>
      <button type="button" id="cb-ok2" style="width:100%;">Ya pagó, registrar</button>
      <p class="nota">Queda por verificar: la administración confirma la referencia.</p>
    </div>`;
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = () => copiarTxt(b.dataset.copiar));
  if (linkPaypal && window.QRCode){
    new QRCode($('qr-paypal'), { text: linkPaypal, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  }
  $('cb-ok2').onclick = () => registrarCobro(d, m.tipo, Number($('cb-monto2').value), null, $('cb-ref').value, $('cb-ok2'));
}

/* ---------- Cobros del evento (por anfitrión) ---------- */
async function verCobros(eventoId){
  const cont = $('contenido');
  cont.innerHTML = '<div class="vacio">Cargando cobros…</div>';
  const { data, error } = await sb.rpc('fn_cobros_puerta_resumen', { p_evento_id: eventoId });
  if (error || data?.error){ cont.innerHTML = '<div class="vacio">No se pudieron cargar los cobros.</div>'; return; }
  const filas = data.cobros || [], tot = data.totales || [];
  $('donde').textContent = 'Cobros del evento';
  cont.innerHTML = `
    <div class="acciones" style="margin-bottom:14px;"><button type="button" class="sec" id="cb-volver">Volver a la lista</button></div>
    <h2>${data.ve_todos ? 'Cobros de todos los anfitriones' : 'Mis cobros'}</h2>
    ${tot.length ? `<table class="tabla-tot"><thead><tr><th>Anfitrión</th><th>Método</th><th>Cobros</th><th>USD</th><th>Vueltos</th></tr></thead><tbody>${
      tot.map(t => `<tr><td>${esc(t.anfitrion || '—')}</td><td>${esc(t.metodo)}</td><td>${t.cobros}</td><td>${Number(t.monto_usd).toFixed(2)}</td><td>${Number(t.vueltos).toFixed(2)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${filas.length ? filas.map(f => `
      <div class="fila-cobro">
        <div class="arriba"><span>${esc(f.cliente || 'Sin nombre')}</span><span>${Number(f.monto_usd).toFixed(2)} USD</span></div>
        <div class="abajo">${esc(f.metodo)}${f.referencia ? ' · ref ' + esc(f.referencia) : ''}${f.recibido ? ' · recibió ' + Number(f.recibido).toFixed(2) + ', vuelto ' + Number(f.vuelto).toFixed(2) : ''}</div>
        <div class="abajo">Cobró: ${esc(f.anfitrion || '—')} · ${esc(new Date(f.cuando).toLocaleString('es-VE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }))} · <strong>${esc(f.estado)}</strong></div>
        ${data.ve_todos && f.estado === 'Por verificar' ? `<div class="acciones" style="margin-top:8px;"><button type="button" data-ver="${esc(f.cobro_id)}" data-ok="1">Verificar</button><button type="button" class="sec" data-ver="${esc(f.cobro_id)}" data-ok="0">Rechazar</button></div>` : ''}
      </div>`).join('') : '<div class="vacio">Todavía no hay cobros registrados en este evento.</div>'}`;
  $('cb-volver').onclick = () => abrirEvento(eventoId);
  cont.querySelectorAll('[data-ver]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data: r, error: e } = await sb.rpc('fn_verificar_cobro_puerta', { p_cobro_id: b.dataset.ver, p_aprobar: b.dataset.ok === '1' });
    if (e || r?.error){ b.disabled = false; toast('No se pudo actualizar.'); return; }
    toast(b.dataset.ok === '1' ? 'Cobro verificado' : 'Cobro rechazado');
    verCobros(eventoId);
  });
}

/* ---------- Un evento ---------- */
async function abrirEvento(id){
  const cont = $('contenido');
  cont.innerHTML = '<div class="vacio">Cargando la lista…</div>';
  const { data, error } = await sb.rpc('fn_lista_asistentes_evento', { p_evento_id: id });
  if (error || data?.error){ cont.innerHTML = '<div class="vacio">No se pudo cargar la lista de este evento.</div>'; return; }
  eventoActual = data; filtro = '';
  pintarEvento();
}

function pintarEvento(){
  const { evento, asistentes } = eventoActual;
  $('donde').textContent = evento.nombre;
  const totalPers = asistentes.reduce((s, a) => s + Number(a.personas || 1), 0);
  const llegaron = asistentes.filter(a => a.asistio).reduce((s, a) => s + Number(a.personas || 1), 0);
  const pct = totalPers ? Math.round(llegaron * 100 / totalPers) : 0;

  const q = filtro.trim().toLowerCase();
  const visibles = asistentes.filter(a => !q || (`${a.nombre || ''} ${a.apellido || ''}`).toLowerCase().includes(q));

  $('contenido').innerHTML = `
    <div class="acciones" style="margin-bottom:14px;">
      <button type="button" class="sec" id="volver">Volver a mis eventos</button>
      <button type="button" class="sec" id="refrescar">Actualizar lista</button>
      <button type="button" class="sec" id="ver-cobros">Cobros</button>
    </div>
    <h2>${esc(evento.nombre)}</h2>
    <p class="sub">${esc(fmtFecha(evento.fecha))}${evento.hora ? ' · ' + esc(evento.hora) : ''}</p>
    <div class="resumen">
      <div><span class="num">${llegaron}</span> <span class="de">de ${totalPers} persona(s) han llegado</span></div>
      <div class="barra-prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
    </div>
    <div class="herramientas">
      <input id="buscar" type="search" placeholder="Buscar por nombre o apellido" value="${esc(filtro)}">
      <button type="button" class="sec" id="copiar">Copiar lista</button>
    </div>
    <div id="lista">${
      visibles.length ? visibles.map(a => `
        <div class="asistente ${a.asistio ? 'llego' : ''}">
          <div class="datos">
            <div class="nombre">${esc(((a.nombre || '') + ' ' + (a.apellido || '')).trim() || 'Sin nombre')}</div>
            <div class="det">${a.personas} persona(s)${a.asistio ? ' · Llegó' + (a.atendio ? ' (atendió ' + esc(a.atendio) + ')' : '') : ''}</div>
            ${Number(a.saldo) > 0 ? `<span class="chip">Cobrar en efectivo: ${esc(money(a.saldo, a.moneda))}</span>` : ''}
          </div>
          <button type="button" data-compra="${esc(a.compra_id)}" data-asistio="${a.asistio ? '1' : '0'}">${a.asistio ? 'Desmarcar' : 'Llegó'}</button>
        </div>`).join('')
      : `<div class="vacio">${asistentes.length ? 'Nadie coincide con esa búsqueda.' : 'Todavía no hay reservas pagadas para este evento.'}</div>`
    }</div>`;

  $('volver').onclick = mostrarMisEventos;
  $('refrescar').onclick = () => abrirEvento(evento.id);
  $('ver-cobros').onclick = () => verCobros(evento.id);
  $('buscar').addEventListener('input', (e) => {
    filtro = e.target.value;
    const pos = e.target.selectionStart;
    pintarEvento();
    const n = $('buscar'); n.focus(); n.setSelectionRange(pos, pos);
  });
  $('copiar').onclick = () => {
    const txt = asistentes.map((a, i) =>
      `${i + 1}. ${((a.nombre || '') + ' ' + (a.apellido || '')).trim()} · ${a.personas} pers.${a.asistio ? ' · llegó' : ''}`).join('\n');
    navigator.clipboard.writeText(txt).then(() => toast('Lista copiada'), () => toast('No se pudo copiar'));
  };
  document.querySelectorAll('[data-compra]').forEach(b => b.onclick = () => marcar(b));
}

async function marcar(btn){
  const id = btn.dataset.compra;
  const nuevo = btn.dataset.asistio !== '1';
  btn.disabled = true;
  const { data, error } = await sb.rpc('fn_marcar_asistencia', { p_compra_id: id, p_asistio: nuevo });
  if (error || data?.error){
    btn.disabled = false;
    toast('No se pudo guardar. Intenta de nuevo.');
    return;
  }
  const a = eventoActual.asistentes.find(x => x.compra_id === id);
  if (a) a.asistio = nuevo;
  pintarEvento();
}

iniciar();
</script>
</body>
</html>
