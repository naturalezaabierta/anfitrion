<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122119">
<title>Anfitriones · Naturaleza Abierta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-950:#122119; --verde-800:#234131; --verde-700:#2d503e; --verde-600:#3e6d54; --verde-100:#e4eee7; --verde-50:#f0f6f2;
    --arena-50:#f7f9f7; --arena-100:#f0f2ef;
    --ocre-600:#9c6f2f; --ocre-100:#fbf3e5;
    --rojo-600:#c23e3e; --rojo-50:#fdf2f2;
    --tinta-fuerte:#111814; --tinta:#232d27; --tinta-suave:#66736a;
    --borde:#e2e8e3; --borde-suave:#edf1ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--arena-50); color:var(--tinta);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important;}
  button{
    font-family:inherit; font-weight:600; font-size:15px; cursor:pointer;
    border:1px solid transparent; background:var(--verde-700); color:#fff;
    padding:12px 18px; border-radius:10px; min-height:46px;
  }
  button:hover{background:var(--verde-800);}
  button:disabled{opacity:.55;cursor:not-allowed;}
  button.sec{background:#fff;color:var(--tinta);border-color:var(--borde);}
  button.sec:hover{background:var(--arena-50);}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgba(62,109,84,.45);outline-offset:2px;}
  input{
    font-family:inherit; font-size:16px; width:100%; padding:12px 14px;
    border:1px solid var(--borde); border-radius:10px; background:#fff; color:var(--tinta-fuerte);
  }
  label{display:block;font-size:13px;font-weight:600;color:var(--tinta-suave);margin-bottom:6px;}
  a{color:var(--verde-600);}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 15%,#eaf2ec 0%,var(--arena-50) 65%);}
  .login-caja{width:100%;max-width:380px;}
  .login-marca{text-align:center;margin-bottom:24px;}
  .login-marca img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;
    box-shadow:0 4px 12px rgba(18,33,25,.06);margin-bottom:12px;}
  .login-marca h1{margin:0 0 4px;font-size:22px;color:var(--verde-950);letter-spacing:-.02em;}
  .login-marca p{margin:0;color:var(--tinta-suave);}
  .tarjeta-login{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:24px;}
  .campo{margin-bottom:14px;}
  .error{background:var(--rojo-50);color:var(--rojo-600);border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0 0;}

  /* App */
  header.barra{
    position:sticky;top:0;z-index:5;background:var(--verde-950);color:#fff;
    display:flex;align-items:center;gap:12px;padding:10px 16px;
  }
  header.barra img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;}
  header.barra .tit{flex:1;min-width:0;}
  header.barra .tit strong{display:block;font-size:14px;}
  header.barra .tit span{display:block;font-size:12px;color:#a4b8ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.barra button{background:rgba(255,255,255,.1);min-height:38px;padding:8px 14px;font-size:13px;}
  main{max-width:720px;margin:0 auto;padding:18px 16px 60px;}
  h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em;color:var(--tinta-fuerte);}
  .sub{margin:0 0 16px;color:var(--tinta-suave);}
  .vacio{padding:40px 16px;text-align:center;color:var(--tinta-suave);}

  .evento{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:12px;}
  .evento h3{margin:0 0 4px;font-size:17px;color:var(--verde-950);}
  .evento .meta{color:var(--tinta-suave);font-size:13.5px;margin-bottom:12px;}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;}
  .acciones a{text-decoration:none;}

  .resumen{background:var(--verde-950);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .resumen .num{font-size:30px;font-weight:700;letter-spacing:-.02em;}
  .resumen .de{color:#a4b8ab;font-size:14px;}
  .barra-prog{height:8px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:10px;overflow:hidden;}
  .barra-prog div{height:100%;background:#8fd0a9;border-radius:99px;transition:width .25s ease;}

  .herramientas{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .herramientas input{flex:1;min-width:180px;}

  .asistente{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--borde);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .asistente.llego{background:var(--verde-50);border-color:#cfe3d6;}
  .asistente .datos{flex:1;min-width:0;}
  .asistente .nombre{font-weight:700;color:var(--tinta-fuerte);overflow-wrap:anywhere;}
  .asistente .det{font-size:13px;color:var(--tinta-suave);}
  .chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ocre-100);color:var(--ocre-600);margin-top:4px;}
  .asistente button{min-width:96px;}
  .asistente.llego button{background:#fff;color:var(--verde-700);border-color:#cfe3d6;}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta-fuerte);color:#fff;
    padding:10px 16px;border-radius:99px;font-size:13px;z-index:20;}

  /* Resultado de escaneo */
  .resultado{border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;border:2px solid;}
  .resultado.ok{background:var(--verde-50);border-color:#8fd0a9;}
  .resultado.warn{background:var(--ocre-100);border-color:#e4c88f;}
  .resultado.bad{background:var(--rojo-50);border-color:#eba5a5;}
  .resultado .grande{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;}
  .resultado.ok .grande{color:var(--verde-700);} .resultado.warn .grande{color:var(--ocre-600);} .resultado.bad .grande{color:var(--rojo-600);}
  .resultado .quien{font-size:19px;font-weight:700;color:var(--tinta-fuerte);overflow-wrap:anywhere;}
  .resultado .linea{color:var(--tinta);margin-top:4px;}
  .regalo{margin:12px 0;text-align:center;}
  .regalo .hecho{display:inline-block;padding:10px 16px;border-radius:99px;background:var(--verde-100);color:var(--verde-700);font-weight:600;}

  /* Cobro en la puerta */
  .tit-sec{margin:18px 0 8px;font-size:15px;color:var(--tinta-fuerte);}
  .metodos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  button.metodo{background:#fff;color:var(--tinta);border:1px solid var(--borde);padding:10px 14px;min-height:42px;}
  button.metodo.activo{background:var(--verde-700);color:#fff;border-color:var(--verde-700);}
  .caja-metodo{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;}
  .caja-metodo .campo{margin-bottom:12px;}
  .dato{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1ee;}
  .dato span{color:var(--tinta-suave);font-size:13px;}
  .dato strong{display:block;color:var(--tinta-fuerte);overflow-wrap:anywhere;}
  .dato button{min-height:36px;padding:6px 12px;font-size:13px;}
  .qrimg{display:block;margin:12px auto 4px;max-width:240px;width:100%;border-radius:10px;}
  .nota{font-size:13px;color:var(--tinta-suave);margin:10px 0 0;}
  .vuelto{font-size:20px;font-weight:700;color:var(--ocre-600);margin-top:8px;}
  .fila-cobro{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .fila-cobro .arriba{display:flex;justify-content:space-between;gap:10px;font-weight:700;}
  .fila-cobro .abajo{font-size:13px;color:var(--tinta-suave);margin-top:2px;}
  .tabla-tot{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px;background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden;}
  .tabla-tot th,.tabla-tot td{padding:8px 10px;text-align:left;border-bottom:1px solid #edf1ee;}
  .tabla-tot th{font-size:12px;color:var(--tinta-suave);}
  @media (prefers-reduced-motion:reduce){.barra-prog div{transition:none;}}
  .tabla-tot{display:block;overflow-x:auto;white-space:nowrap;}

  /* Escáner con cámara */
  #scan{position:fixed;inset:0;z-index:100;background:#000;color:#fff;overflow:hidden;}
  #scan[hidden]{display:none;}
  #scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .scan-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));z-index:2;}
  .scan-top button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;min-height:44px;padding:8px 16px;border-radius:99px;}
  .scan-top span{font-weight:700;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scan-marco{position:absolute;left:50%;top:40%;width:min(68vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);
    border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none;}
  #scan-msg{position:absolute;left:0;right:0;top:calc(40% + min(34vw,160px) + 22px);text-align:center;font-weight:600;font-size:15px;padding:0 24px;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:1;}
  #scan-res{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#1d2a22;border-radius:22px 22px 0 0;
    padding:16px 16px max(16px,env(safe-area-inset-bottom));z-index:3;box-shadow:0 -8px 30px rgba(0,0,0,.35);max-height:75vh;overflow:auto;}
  #scan-res[hidden]{display:none;}
  #scan-res .resultado{margin-bottom:12px;padding:16px 14px;}
  #scan-res .acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  #scan-res .acciones button{min-height:50px;flex:1 1 140px;}
  .barra-auto{height:4px;border-radius:4px;background:#d8efe1;overflow:hidden;margin:0 0 12px;}
  .barra-auto div{height:100%;width:100%;background:#2e8b57;transform-origin:left;animation:autoavance 2.2s linear forwards;}
  @keyframes autoavance{from{transform:scaleX(1);}to{transform:scaleX(0);}}
</style>
</head>
<body>

<!-- ============ ENTRAR ============ -->
<div id="login">
  <div class="login-caja">
    <div class="login-marca">
      <img alt="Naturaleza Abierta" src="https://www.naturalezaabierta.com/wp-content/uploads/2026/03/cropped-cropped-solo-logo-WEB2.png">
      <h1>Anfitriones</h1>
      <p>Naturaleza Abierta</p>
    </div>
    <div class="tarjeta-login">
      <form id="form-login">
        <div class="campo"><label for="email">Correo</label>
          <input id="email" type="email" required autocomplete="username" placeholder="tu@correo.com"></div>
        <div class="campo"><label for="clave">Contraseña</label>
          <input id="clave" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
        <button type="submit" id="btn-entrar" style="width:100%;">Entrar</button>
        <p class="error" id="login-error" hidden></p>
      </form>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="barra">
    <img alt="" src="https://www.naturalezaabierta.com/wp-content/uploads/2026/03/cropped-cropped-solo-logo-WEB2.png">
    <div class="tit"><strong id="quien">Anfitrión</strong><span id="donde">Mis eventos</span></div>
    <button id="btn-salir" type="button">Salir</button>
  </header>
  <main id="contenido"></main>
</div>

<!-- ============ ESCÁNER ============ -->
<div id="scan" hidden role="dialog" aria-label="Escanear entradas">
  <video id="scan-video" playsinline muted autoplay></video>
  <div class="scan-top">
    <button type="button" id="scan-cerrar">✕ Cerrar</button>
    <span id="scan-titulo">Escanear entradas</span>
    <button type="button" id="scan-luz" hidden aria-label="Linterna">🔦</button>
  </div>
  <div class="scan-marco"></div>
  <p id="scan-msg">Abriendo la cámara…</p>
  <div id="scan-res" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(
  'https://tgvcvnhrwswuxgjbpvwq.supabase.co',
  'sb_publishable_EKV8OM1y96u-DV_kUPGwkg_BZuGdf4D'
);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtFecha = f => {
  if (!f) return 'Sin fecha';
  const s = String(f);
  const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00') : new Date(s);
  return d.toLocaleDateString('es-VE', { weekday:'long', day:'numeric', month:'long' });
};
const money = (n, m) => Number(n || 0).toFixed(2) + ' ' + (m || 'USD');

let eventoActual = null;   // { evento, asistentes, total_personas }
let filtro = '';
const tokenUrl = new URLSearchParams(location.search).get('t');

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- Entrar / salir ---------- */
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btn-entrar'), err = $('login-error');
  err.hidden = true; btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('clave').value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error){
    err.textContent = error.message === 'Invalid login credentials'
      ? 'Correo o contraseña incorrectos. Revisa los datos e intenta de nuevo.' : error.message;
    err.hidden = false; return;
  }
  iniciar();
});

$('btn-salir').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $('login').hidden = false; $('app').hidden = true; return; }
  $('login').hidden = true; $('app').hidden = false;

  const { data: perfil } = await sb.from('usuarios_panel').select('nombre,email').eq('id', session.user.id).maybeSingle();
  $('quien').textContent = perfil?.nombre || perfil?.email || session.user.email;
  if (tokenUrl){ procesarQR(tokenUrl); } else { mostrarMisEventos(); }
}

/* ---------- Mis eventos ---------- */
async function mostrarMisEventos(){
  eventoActual = null; filtro = '';
  $('donde').textContent = 'Mis eventos';
  const cont = $('contenido');
  cont.innerHTML = '<div class="vacio">Cargando tus eventos…</div>';
  const { data, error } = await sb.rpc('fn_mis_eventos_anfitrion');
  if (error){ cont.innerHTML = '<div class="vacio">No se pudieron cargar tus eventos. Revisa tu conexión y vuelve a abrir la página.</div>'; return; }
  const lista = data || [];
  if (!lista.length){
    cont.innerHTML = '<h2>Mis eventos</h2><div class="vacio">Todavía no tienes eventos asignados. Pide a la administración que te asigne uno con este correo.</div>';
    return;
  }
  cont.innerHTML = '<h2>Mis eventos</h2><p class="sub">Toca un evento para ver quién viene y marcar quién llegó.</p>' +
    lista.map(e => `
      <div class="evento">
        <h3>${esc(e.nombre)}</h3>
        <div class="meta">${esc(fmtFecha(e.fecha))}${e.hora ? ' · ' + esc(e.hora) : ''}${e.ciudad_estado ? ' · ' + esc(e.ciudad_estado) : ''}<br>${e.personas_pagadas} persona(s) con reserva pagada</div>
        <div class="acciones">
          <button type="button" data-escanear="${esc(e.id)}">📷 Escanear entradas</button>
          <button type="button" class="sec" data-ver="${esc(e.id)}">Ver asistentes</button>
          ${e.enlace_grupo_whatsapp ? `<a href="${esc(e.enlace_grupo_whatsapp)}" target="_blank" rel="noopener"><button type="button" class="sec">Grupo de WhatsApp</button></a>` : ''}
        </div>
      </div>`).join('');
  cont.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => abrirEvento(b.dataset.ver));
  cont.querySelectorAll('[data-escanear]').forEach(b => b.onclick = () => abrirEscaner(b.dataset.escanear));
}

/* ---------- Escaneo de entrada (QR) ---------- */
const copiarTxt = (t) => navigator.clipboard.writeText(String(t)).then(() => toast('Copiado'), () => toast('No se pudo copiar'));
const nombreDe = d => ((d.nombre || '') + ' ' + (d.apellido || '')).trim();
const bs = n => Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function procesarQR(token){
  history.replaceState(null, '', location.pathname);
  await escanear(token);
}

async function escanear(token){
  $('donde').textContent = 'Escaneo de entrada';
  $('contenido').innerHTML = '<div class="vacio">Verificando entrada…</div>';
  const { data, error } = await sb.rpc('fn_marcar_asistencia_qr', { p_token: token });
  pintarResultadoQR(data, error);
}

function pintarResultadoQR(d, error){
  const cont = $('contenido');
  const salir = '<div class="acciones" style="justify-content:center;"><button type="button" id="qr-listo">📷 Escanear siguiente</button><button type="button" class="sec" id="qr-eventos">Mis eventos</button></div>';
  if (!error && d && !d.error && Number(d.saldo) > 0 && (d.resultado === 'saldo_pendiente' || d.resultado === 'ya_habia_llegado')){
    return pintarCobro(d);
  }
  let html;
  if (error || !d){
    html = `<div class="resultado bad"><p class="grande">Sin conexión</p><div class="linea">No se pudo verificar. Revisa tu internet y vuelve a escanear el código.</div></div>${salir}`;
  } else if (d.error){
    const msg = {
      no_encontrada: ['Código no válido', 'Este código no corresponde a ninguna entrada.'],
      sin_acceso: ['Sin permiso', 'Tu cuenta no puede validar entradas.'],
      otro_evento: ['Otro evento', `Esta entrada es de “${esc(d.evento_nombre || '')}”, un evento que no tienes asignado.`],
      sin_pagar: ['Pago pendiente', `La reserva de ${esc(nombreDe(d))} no tiene el pago confirmado.`]
    }[d.error] || ['No se pudo validar', 'Intenta de nuevo.'];
    html = `<div class="resultado ${d.error === 'sin_pagar' ? 'warn' : 'bad'}"><p class="grande">${msg[0]}</p><div class="linea">${msg[1]}</div></div>${salir}`;
  } else {
    const ya = d.resultado === 'ya_habia_llegado';
    const hora = d.marcada_en ? new Date(d.marcada_en).toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' }) : '';
    html = `
      <div class="resultado ${ya ? 'warn' : 'ok'}">
        <p class="grande">${ya ? 'Ya había ingresado' : 'Puede pasar'}</p>
        <div class="quien">${esc(nombreDe(d))}</div>
        <div class="linea">${d.personas} persona(s) · ${esc(d.evento_nombre || '')}</div>
        ${d.total > 1 ? '<div class="linea"><strong>Ingreso '+d.ingresadas+' de '+d.total+'</strong></div>' : ''}
        ${ya && hora ? `<div class="linea">Esta entrada se escaneó a las ${esc(hora)}.</div>` : ''}
        ${!ya ? '<div class="linea"><strong>Entrégale su brazalete.</strong></div>' : ''}
        ${d.vuelto > 0 ? `<div class="vuelto">Entrega de vuelto: ${esc(money(d.vuelto, d.moneda))}</div>` : ''}
      </div>
      <div class="regalo" id="zona-regalo">${
        d.regalo_entregado
          ? '<span class="hecho">Regalo ya entregado</span>'
          : '<button type="button" class="sec" id="btn-regalo">Marcar regalo / obsequio entregado</button>'
      }</div>
      ${salir}
      <div class="acciones" style="justify-content:center;margin-top:10px;"><button type="button" class="sec" id="qr-lista">Ver lista del evento</button></div>`;
  }
  cont.innerHTML = html;
  $('qr-listo').onclick = () => abrirEscaner((d && d.evento_id) || scanEvento);
  $('qr-eventos').onclick = mostrarMisEventos;
  if ($('qr-lista')) $('qr-lista').onclick = () => abrirEvento(d.evento_id);
  if ($('btn-regalo')) $('btn-regalo').onclick = async () => {
    const b = $('btn-regalo'); b.disabled = true;
    const { data: r, error: e } = await sb.rpc('fn_marcar_regalo_qr', { p_token: d.token, p_entregado: true });
    if (e || r?.error){ b.disabled = false; toast('No se pudo guardar el regalo.'); return; }

            ${(a.acompanantes || []).length ? `<div class="det">Con: ${a.acompanantes.map(x => esc(x.nombre) + (x.asistio ? ' ✓' : '')).join(', ')}</div>` : ''}
            ${Number(a.saldo) > 0 ? `<span class="chip">Falta pagar: ${esc(money(a.saldo, a.moneda))}</span>` : ''}

async function marcar(btn){
  const id = btn.dataset.compra;
  const nuevo = btn.dataset.asistio !== '1';
  btn.disabled = true;
  const { data, error } = await sb.rpc('fn_marcar_asistencia', { p_compra_id: id, p_asistio: nuevo });
  if (error || data?.error){
    btn.disabled = false;
    toast(data?.error === 'saldo_pendiente' ? 'Primero cobra el saldo pendiente.' : 'No se pudo guardar. Intenta de nuevo.');
    return;
  }
  const a = eventoActual.asistentes.find(x => x.compra_id === id);
  if (a){ a.asistio = nuevo; a.ingresadas = nuevo ? Number(a.personas || 1) : 0; }
  pintarEvento();
}

/* ---------- Escáner con cámara dentro de la app (continuo) ---------- */
let scanEvento = null, scanStream = null, scanRaf = null, scanOcupado = false, scanDet = null, scanCanvas = null;
let scanWake = null, scanTimer = null, scanBloqueo = { token: '', hasta: 0 }, scanUltimo = 0, scanLuz = false;

function pitido(ok){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; const c = new AC();
    const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
    o.frequency.value = ok ? 880 : 220; g.gain.value = .12; o.start(); o.stop(c.currentTime + (ok ? .12 : .3));
    setTimeout(() => c.close(), 600);
  }catch(_){}
}
function tokenDeTexto(txt){
  const t = String(txt || '').trim();
  try{ const u = new URL(t); const p = u.searchParams.get('t'); if (p) return p; }catch(_){}
  return /^[A-Za-z0-9]{10,}$/.test(t) ? t : null;
}
function cargarJsQR(){
  return new Promise((ok, mal) => {
    if (window.jsQR) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = ok; s.onerror = mal; document.head.appendChild(s);
  });
}
const msgEscaner = t => { $('scan-msg').textContent = t; };

async function abrirEscaner(eventoId){
  scanEvento = eventoId || null;
  clearTimeout(scanTimer); detenerCamara();
  $('scan').hidden = false; document.body.style.overflow = 'hidden';
  $('scan-res').hidden = true; $('scan-luz').hidden = true;
  $('scan-titulo').textContent = (eventoActual && eventoActual.evento && eventoActual.evento.id === scanEvento) ? eventoActual.evento.nombre : 'Escanear entradas';
  msgEscaner('Abriendo la cámara…');
  scanOcupado = true;
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('sin_camara');
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('scan-video'); v.srcObject = scanStream; await v.play();
    const tr = scanStream.getVideoTracks()[0];
    const caps = tr && tr.getCapabilities ? tr.getCapabilities() : {};
    scanLuz = false; $('scan-luz').hidden = !caps.torch;
    scanDet = null;
    if ('BarcodeDetector' in window){ try{ scanDet = new BarcodeDetector({ formats: ['qr_code'] }); }catch(_){ scanDet = null; } }
    if (!scanDet){ await cargarJsQR(); scanCanvas = document.createElement('canvas'); }
    try{ if (navigator.wakeLock) scanWake = await navigator.wakeLock.request('screen'); }catch(_){}
    msgEscaner('Apunta al código QR de la entrada');
    scanOcupado = false; bucleEscaner();
  }catch(e){
    detenerCamara();
    const negado = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    msgEscaner(negado
      ? 'No tenemos permiso para usar la cámara. Toca el candado junto a la dirección de la página, permite la cámara y vuelve a abrir el escáner.'
      : 'No pudimos abrir la cámara de este teléfono. Cierra otras apps que la estén usando e inténtalo de nuevo.');
  }
}

function detenerCamara(){
  if (scanRaf) cancelAnimationFrame(scanRaf); scanRaf = null;
  if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  try{ $('scan-video').srcObject = null; }catch(_){}
  if (scanWake){ try{ scanWake.release(); }catch(_){} scanWake = null; }
}
function cerrarEscaner(){
  clearTimeout(scanTimer); detenerCamara();
  $('scan').hidden = true; $('scan-res').hidden = true; document.body.style.overflow = '';
}
$('scan-cerrar').onclick = () => {
  const ev = scanEvento; cerrarEscaner();
  if (ev) abrirEvento(ev); else mostrarMisEventos();
};
$('scan-luz').onclick = async () => {
  try{
    scanLuz = !scanLuz;
    await scanStream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: scanLuz }] });
  }catch(_){ scanLuz = false; }
};
document.addEventListener('visibilitychange', () => { if (document.hidden && !$('scan').hidden) detenerCamara(); });

async function bucleEscaner(){
  if (!scanStream) return;
  const v = $('scan-video');
  const ahora = performance.now();
  if (!scanOcupado && v.readyState >= 2 && v.videoWidth && ahora - scanUltimo > 100){
    scanUltimo = ahora;
    let texto = null;
    try{
      if (scanDet){
        const r = await scanDet.detect(v); if (r.length) texto = r[0].rawValue;
      } else if (window.jsQR){
        const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
        scanCanvas.width = w; scanCanvas.height = h;
        const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(v, 0, 0, w, h);
        const im = ctx.getImageData(0, 0, w, h);
        const r = window.jsQR(im.data, w, h, { inversionAttempts: 'dontInvert' });
        if (r) texto = r.data;
      }
    }catch(_){}
    if (texto){
      const t = tokenDeTexto(texto);
      if (t && !scanOcupado && !(t === scanBloqueo.token && Date.now() < scanBloqueo.hasta)) procesarEscaneo(t);
    }
  }
  if (scanStream) scanRaf = requestAnimationFrame(bucleEscaner);
}

async function procesarEscaneo(token){
  scanOcupado = true; clearTimeout(scanTimer);
  if (navigator.vibrate) navigator.vibrate(60);
  msgEscaner('Verificando…');
  const { data, error } = await sb.rpc('fn_marcar_asistencia_qr', { p_token: token });
  mostrarResultadoEscaner(token, data, error);
}

function reanudarEscaner(token){
  clearTimeout(scanTimer);
  $('scan-res').hidden = true;
  scanBloqueo = { token: token || '', hasta: Date.now() + 1800 };
  msgEscaner('Apunta al código QR de la entrada');
  scanOcupado = false;
}

function mostrarResultadoEscaner(token, d, error){
  const res = $('scan-res');
  let clase = 'bad', titulo = '', quien = '', lineas = [], auto = false, regalo = false;
  if (error || !d){
    titulo = 'Sin conexión'; lineas = ['No se pudo verificar. Revisa tu internet y vuelve a escanear el código.'];
  } else if (d.error){
    const msg = {
      no_encontrada: ['Código no válido', 'Este código no corresponde a ninguna entrada.'],
      sin_acceso: ['Sin permiso', 'Tu cuenta no puede validar entradas.'],
      otro_evento: ['Otro evento', `Esta entrada es de “${d.evento_nombre || ''}”, un evento que no tienes asignado.`],
      sin_pagar: ['Pago pendiente', `La reserva de ${nombreDe(d)} no tiene el pago confirmado.`]
    }[d.error] || ['No se pudo validar', 'Intenta de nuevo.'];
    clase = d.error === 'sin_pagar' ? 'warn' : 'bad'; titulo = msg[0]; 
    lineas = [{ t: msg[1] }];
  } else if (Number(d.saldo) > 0 && (d.resultado === 'saldo_pendiente' || d.resultado === 'ya_habia_llegado')){
    pitido(false); cerrarEscaner(); pintarCobro(d); return;   // falta pagar: pantalla de cobro
  } else {
    const ya = d.resultado === 'ya_habia_llegado';
    quien = nombreDe(d) || 'Invitado';
    if (ya){
      clase = 'warn'; titulo = 'Ya había ingresado';
      lineas.push({ t: d.total > 1 ? `Ya entraron las ${d.total} personas de este código.` : 'Esta entrada ya fue usada.' });
      if (d.marcada_en) lineas.push({ t: 'Se escaneó a las ' + new Date(d.marcada_en).toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }) + '.' });
    } else {
      clase = 'ok'; titulo = 'Puede pasar'; auto = true; regalo = !d.regalo_entregado;
      if (d.es_acompanante && d.titular) lineas.push({ t: 'Acompañante de ' + d.titular });
      if (d.total > 1) lineas.push({ t: `Ingreso ${d.ingresadas} de ${d.total}` + (d.ingresadas < d.total ? ` · faltan ${d.total - d.ingresadas} con este código` : ''), b: true });
      lineas.push({ t: 'Entrégale su brazalete.', b: true });
    }
    if (scanEvento && d.evento_id && d.evento_id !== scanEvento) lineas.push({ t: '⚠ Esta entrada es de otro evento: ' + (d.evento_nombre || ''), b: true });
  }
  pitido(clase === 'ok');
  res.innerHTML = `
    ${auto ? '<div class="barra-auto"><div></div></div>' : ''}
    <div class="resultado ${clase}">
      <p class="grande">${esc(titulo)}</p>
      ${quien ? `<div class="quien">${esc(quien)}</div>` : ''}
      ${lineas.map(l => `<div class="linea">${l.b ? '<strong>' + esc(l.t) + '</strong>' : esc(l.t)}</div>`).join('')}
    </div>
    <div class="acciones">
      ${regalo ? '<button type="button" class="sec" id="sc-regalo">🎁 Regalo entregado</button>' : ''}
      <button type="button" id="sc-sig">Siguiente</button>
    </div>`;
  res.hidden = false; msgEscaner('');
  $('sc-sig').onclick = () => reanudarEscaner(token);
  if ($('sc-regalo')) $('sc-regalo').onclick = async () => {
    clearTimeout(scanTimer);
    const bar = res.querySelector('.barra-auto'); if (bar) bar.remove();
    const b = $('sc-regalo'); b.disabled = true;
    const { data: r, error: e } = await sb.rpc('fn_marcar_regalo_qr', { p_token: d.token || token, p_entregado: true });
    if (e || (r && r.error)){ b.disabled = false; toast('No se pudo guardar el regalo.'); return; }
    b.textContent = 'Regalo entregado ✓';
  };
  if (auto) scanTimer = setTimeout(() => reanudarEscaner(token), 2200);
}

iniciar();
</script>
<style>
.ojito-wrap{position:relative;display:block;width:100%}
.ojito-wrap>input{padding-right:44px!important}
.ojito-btn{position:absolute!important;right:6px;top:50%;transform:translateY(-50%);width:34px!important;height:34px;min-height:0!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;cursor:pointer;font-size:17px;line-height:1;opacity:.65;color:#66736a!important}
.ojito-btn:hover{opacity:1}
</style>
<script>
(function(){
  function poner(inp){
    if(inp.dataset.ojito) return;
    inp.dataset.ojito='1';
    var w=document.createElement('span');
    w.className='ojito-wrap';
    inp.parentNode.insertBefore(w,inp);
    w.appendChild(inp);
    var b=document.createElement('button');
    b.type='button';
    b.className='ojito-btn';
    b.textContent='👁';
    b.setAttribute('aria-label','Mostrar contraseña');
    b.onclick=function(){
      var ver=inp.type==='password';
      inp.type=ver?'text':'password';
      b.textContent=ver?'🙈':'👁';
      b.setAttribute('aria-label',ver?'Ocultar contraseña':'Mostrar contraseña');
    };
    w.appendChild(b);
  }
  function buscar(){document.querySelectorAll('input[type=password]').forEach(poner);}
  buscar();
  new MutationObserver(buscar).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
</html>
